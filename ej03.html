<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tablas</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #edf6f9;
            padding: 30px;
        }

        table {
            border-collapse: collapse;
            width: 60%;
            background-color: white;
        }

        th, td {
            border: 1px solid #333;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #1d3557;
            color: white;
        }
    </style>
</head>
<body>

    <h1>Ejercicio 3: Tabla de países y capitales</h1>

    <table>
        <tr>
            <th>País</th>
            <th>Capital</th>
            <th>Continente</th>
        </tr>

        <tr>
            <td>Ecuador</td>
            <td>Quito</td>
            <td>América</td>
        </tr>

        <tr>
            <td>España</td>
            <td>Madrid</td>
            <td>Europa</td>
        </tr>

        <tr>
            <td>Argentina</td>
            <td>Buenos Aires</td>
            <td>América</td>
        </tr>
    </table>

</html>
