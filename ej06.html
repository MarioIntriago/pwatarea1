<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Diseño de caja</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            padding: 30px;
            text-align: center;
        }

        .caja {
            width: 70%;
            margin: auto;
            border: 3px solid #1d3557;
            background-color: #a8dadc;
            padding: 30px;
            border-radius: 12px;
        }

        .slider {
            width: 80%;
            overflow: hidden;
            margin: auto;
            border-radius: 10px;
        }

        .slider img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .texto {
            text-align: center;
            font-size: 22px;
            color: #1d3557;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>Ejercicio 6: Caja con slider</h1>

    <div class="caja">
        <div class="slider">
            <img src="Imagenes/game.png" alt="Imagen de videojuego">
        </div>

        <div class="texto">
            Mis pasatiempos favoritos
        </div>
    </div>

    <br>

    <a href="index.html">Volver al inicio</a>

</body>
</html>
